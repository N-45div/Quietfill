# Pings the Render free instance so it never hits the 15-minute idle
# spin-down. Defaults to the deployed backend; override by setting a PROXY_URL
# repository variable (Settings -> Secrets and variables -> Actions -> Variables).
#
# Note: GitHub pauses scheduled workflows after 60 days without repo activity;
# any push resets the clock.
name: keep-proxy-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping proxy /info
        env:
          PROXY_URL: ${{ vars.PROXY_URL || 'https://quietfill-fcc.onrender.com' }}
        run: |
          curl -sf --max-time 90 "$PROXY_URL/info" > /dev/null \
            && echo "proxy awake: $PROXY_URL" \
            || echo "ping failed (cold start or proxy down) - the request itself still triggers wake-up"
