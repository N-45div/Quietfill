# Pings the Render free instance so it never hits the 15-minute idle
# spin-down. Set the PROXY_URL repository variable (Settings -> Secrets and
# variables -> Actions -> Variables) to the Render backend URL, e.g.
# https://quietfill-fcc.onrender.com
#
# Note: GitHub pauses scheduled workflows after 60 days without repo activity;
# any push resets the clock.
name: keep-proxy-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping proxy /info
        run: |
          if [ -z "${{ vars.PROXY_URL }}" ]; then
            echo "PROXY_URL repo variable not set - skipping"
            exit 0
          fi
          curl -sf --max-time 90 "${{ vars.PROXY_URL }}/info" > /dev/null \
            && echo "proxy awake" \
            || echo "ping failed (cold start or proxy down) - the request itself still triggers wake-up"
