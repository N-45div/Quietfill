# Keeps the hosted TEE deliverable without anyone remembering to.
#
# Two things silently stop instruction delivery, and neither is visible
# on-chain (the machine reads PRODUCTION either way):
#
#   1. A host restart mints a new enclave identity, orphaning the
#      registration. scripts/refresh-tee.sh re-registers the identity the
#      proxy actually serves and retires what it replaced.
#   2. The availability check ages out (~6h). The script renews it on a
#      healthy stack every couple of hours using register-tee's attestation
#      and availability steps alone, which are valid on an already-registered
#      machine.
#
# The script runs inside the same golang container used when operating by
# hand — environment drift between the runner and that container previously
# produced CI-only failures that could not be reproduced locally. Identical
# environment, identical behaviour. The healthy no-op path costs about a
# minute; the pass/fail signal is the final verification, and the summary
# carries the output either way.
#
# Requires one repository secret: DEPLOYMENT_PRIVATE_KEY (machine owner; a
# funded Coston2 testnet key, never a mainnet one). Without it the run still
# reports health, and fails only if healing was actually needed.
name: heal-tee-registration

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: tee-refresh
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXT_PROXY_URL: ${{ vars.PROXY_URL || 'https://quietfill-fcc.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Heal or renew (same container as the manual procedure)
        env:
          DEPLOYMENT_PRIVATE_KEY: ${{ secrets.DEPLOYMENT_PRIVATE_KEY }}
        run: |
          set -o pipefail
          docker run --rm \
            -e HOME=/tmp -e GOCACHE=/tmp/go-cache -e GOPATH=/tmp/go \
            -e GOTOOLCHAIN=auto \
            -e DEPLOYMENT_PRIVATE_KEY \
            -e EXT_PROXY_URL \
            -e SIMULATED_TEE=true \
            -v "$PWD:/workspace" -w /workspace \
            golang:1.25.1 \
            bash -c 'curl -sL https://foundry.paradigm.xyz | bash >/dev/null 2>&1; export PATH=/tmp/.foundry/bin:$PATH; foundryup >/dev/null 2>&1; bash scripts/refresh-tee.sh' \
            2>&1 | tee heal.txt
          { echo "### Heal / renew"; echo '```'; tail -30 heal.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deliverable
        if: always()
        run: |
          set -o pipefail
          node scripts/check-tee.mjs 2>&1 | tee verify.txt
          { echo "### Verification"; echo '```'; cat verify.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
